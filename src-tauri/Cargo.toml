[package]
name = "hx-ai"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hx_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
dotenvy = "0.15.7"
thiserror = "2.0.21"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tokio = { version = "1.54.1", features = ["time", "macros"] }
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-av-foundation = "0.3.2"
block2 = "0.6.2"
cpal = "0.18"
hound = "3.5.1"
xcap = "0.9"
enigo = "0.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "http2"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "wav", "pcm"] }


# 録音とリファレンスの加工 (リサンプル・MP3 のデコード) は最適化しないと 100 倍ほど遅く、
# 開発起動 (tauri dev) やテストで数秒待たされるので、開発時も最適化する。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
