# cargo mutants の設定。実装をわざと少し壊し、テストが気づくかを確かめる。
# OS に触る部分 (実機でしか確かめられない) は対象から外す。

exclude_globs = [
  "src/macos.rs",
  "src/audio.rs",
  "src/lib.rs",
  "src/*_test.rs",
  "src/main.rs",
]

# 正規表現は「replace X with Y in 関数名」「replace 関数名 -> 型 with 値」という表示名に当たる。
# 表示名にモジュールのパスは含まれないので、「workflow::」のようには書けない。
exclude_re = [
  "UsbHxPort",
  "probe_status",
  "format_usb_error",
  "TauriEngine",
  "emit_progress",
  "emit_chain",
  "disconnect_hx_port",
  "is_hx_session_open",
  "blocking",
  "ensure_microphone_permission",
  # Tauri から呼ぶ入口 (権限・録音・本物のエンジンを組み立てる)。流れは auto_loop / send / revert でテストする
  "\\b(replace|in) (run_loop|send_message|start_recording|stop_recording|undo_last|read_chain_view)( |$)",
  "replace process_env ",
  # 待ち時間は 0 で走らせるので、値を変えてもテストでは区別できない
  "\\b(replace|in) call( |$)",
]
